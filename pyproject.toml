[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "additdownloader"
version = "1.0.0"
description = "CLI for managing a small app registry, downloads, and window cask scaffolds"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
additdownloader = "addit:main"

[tool.setuptools]
py-modules = ["addit"]
